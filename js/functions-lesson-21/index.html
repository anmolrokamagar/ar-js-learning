<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
    <script>
        function hello(){
            document.write("Hello Everybody");//Here we only made a funciton but didnot call
        }

        function anmol(){
            document.write("Hello Anmol");//Here we only made a funciton but didnot call
        }
        hello();//This is call it will show fuction statement or declaration
        hello()
        document.write("<br>");
        hello()
        document.write("<br>");
        hello()
        document.write("<br>");
        hello()
        anmol();
    </script>
</head>

</body>
</html>
